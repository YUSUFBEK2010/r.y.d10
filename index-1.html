<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0d">
  <title>My Socials</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --card: rgba(255,255,255,.055);
      --line: rgba(255,255,255,.11);
      --text: #f5f5f7;
      --muted: #9b9ba5;
      --accent: #b9a3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 18px;
      display: grid; place-items: center;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(124,92,220,.19), transparent 48%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { width: min(100%, 420px); text-align: center; }
    .avatar {
      width: 86px; height: 86px; margin: 0 auto 20px;
      display: grid; place-items: center; border-radius: 28px;
      background: linear-gradient(145deg, #c9b8ff, #7655c8);
      color: #17121f; font-size: 30px; font-weight: 800;
      box-shadow: 0 12px 45px rgba(139,104,230,.25);
    }
    h1 { margin: 0; font-size: 29px; letter-spacing: -.8px; }
    .subtitle { margin: 9px 0 30px; color: var(--muted); font-size: 14px; }
    .links { display: grid; gap: 12px; }
    .link {
      min-height: 68px; padding: 0 18px; display: flex; align-items: center;
      gap: 14px; text-decoration: none; color: var(--text);
      background: var(--card); border: 1px solid var(--line);
      border-radius: 18px; text-align: left;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .link:hover { transform: translateY(-2px); border-color: rgba(185,163,255,.55); background: rgba(255,255,255,.085); }
    .icon {
      width: 42px; height: 42px; display: grid; place-items: center;
      border-radius: 13px; background: rgba(255,255,255,.09); flex: 0 0 42px;
    }
    .icon svg { width: 22px; height: 22px; fill: currentColor; }
    .label { flex: 1; font-size: 15px; font-weight: 650; }
    .handle { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 400; }
    .arrow { color: #85818f; font-size: 20px; }
    footer { margin-top: 28px; color: #696873; font-size: 11px; letter-spacing: .5px; }
    @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
  </style>
</head>
